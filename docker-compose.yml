services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subscriptions
      POSTGRES_USER: subscriptions
      POSTGRES_PASSWORD: subscriptions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscriptions -d subscriptions"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      APP_ADDR: ${APP_ADDR:-:8080}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgres://subscriptions:subscriptions@postgres:5432/subscriptions?sslmode=disable}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
